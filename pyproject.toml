[project]
name = "nexusmind"
version = "0.1.0"
description = "Versioned Riot ingestion and grounded League of Legends coaching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "qdrant-client>=1.17.1,<2",
    "requests>=2.32.5",
    "sentence-transformers>=5.4.1,<6",
    "torch>=2.11,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project.scripts]
nexusmind = "nexusmind.cli:main"

[project.optional-dependencies]
orchestration = ["langgraph>=1.0.9"]
legacy = ["beautifulsoup4>=4.14.3", "pandas>=3.0.1", "python-dotenv>=1.2.1", "langchain>=1.2.10", "streamlit>=1.19.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nexusmind"]

[tool.hatch.build.targets.sdist]
# Never walk local Qdrant volumes, model caches or historical work in an sdist.
only-include = ["src/nexusmind", "tests", "evaluation", "docs", ".github", "README.md", "AGENTS.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.uv]
# Older protobuf enum wrappers break the Qdrant generated client's type annotations.
constraint-dependencies = ["protobuf>=6.33,<8"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: isolated Qdrant integration without network"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
