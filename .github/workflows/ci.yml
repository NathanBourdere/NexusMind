name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  python-checks:
    name: python-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra web
      - run: uv run --frozen --extra web ruff check src tests
      - run: uv run --frozen --extra web ruff format --check src tests
      - run: uv run --frozen --extra web pytest -q
      - run: uv build
      - run: uv run --frozen nexusmind --help
